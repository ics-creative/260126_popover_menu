<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Plane Menu</title>

    <style>
      :root {
        --page-background: #f2f4f7;
        --text-color: #0f172a;
        --menu-background: #fff;
        --menu-border-color: #e2e8f0;
        --focus-ring-color: color-mix(in oklab, #4f46e5 35%, transparent);
        --item-highlight-color: color-mix(in oklab, #000 8%, transparent);
        --separator-color: color-mix(
          in oklab,
          var(--menu-border-color) 75%,
          var(--menu-background)
        );
        --menu-shadow: 0 2px 10px rgb(15 23 42 / 0.06);

        --button-size: 48px;
        --menu-width: 196px;
        --menu-radius: 26px;
        --item-radius: 16px;
        --menu-icon-size: 16px;
        --button-icon-size: 20px;
        --icon-column-width: 18px;
        --item-text-size: 1rem;
        --space-small: 8px;
        --space-medium: 12px;
        --space-tiny: 2px;
        --focus-ring-offset: 4px;
        --content-entry-offset: -6px;

        /* メニューの拡大・縮小と、中身のフェードにかける時間。 */
        --menu-resize-time: 600ms;
        --content-fade-time: 200ms;
        --content-reveal-delay: 70ms;
        --preview-return-delay: 60ms;

        /* 小さく行き過ぎてから戻るスプリング。 */
        /* prettier-ignore */
        --menu-spring: linear(0, 0.008, 0.0299, 0.0628, 0.1044, 0.1522, 0.2046, 0.2599, 0.3166, 0.3737, 0.4302, 0.4853, 0.5385, 0.5892, 0.6371, 0.682, 0.7238, 0.7623, 0.7975, 0.8295, 0.8584, 0.8843, 0.9073, 0.9276, 0.9453, 0.9607, 0.974, 0.9852, 0.9947, 1.0025, 1.0089, 1.014, 1.018, 1.0209, 1.023, 1.0244, 1.0252, 1.0254, 1.0252, 1.0246, 1.0238, 1.0227, 1.0215, 1.0202, 1.0188, 1.0173, 1.0159, 1.0144, 1.013, 1.0117, 1.0104, 1.0092, 1.0081, 1.007, 1.006, 1.0051, 1.0043, 1.0036, 1.0029, 1.0023, 1.0018, 1.0014, 1.001, 1.0007, 1.0004, 1.0001, 0.9999, 0.9998, 0.9996, 0.9995, 0.9995, 0.9994, 0.9994, 0.9994, 0.9994, 0.9994, 0.9994, 0.9994, 0.9994, 0.9995, 0.9995, 0.9995, 0.9996, 0.9996, 0.9996, 0.9997, 0.9997, 0.9997, 0.9998, 0.9998, 0.9998, 0.9998, 0.9999, 0.9999, 0.9999, 0.9999, 0.9999, 1, 1, 1, 1);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--page-background);
        color: var(--text-color);
        font-family: sans-serif;
      }

      .share-menu {
        position: absolute;
        top: calc(75% - var(--button-size) / 2);
        left: calc(50% - var(--button-size) / 2);
      }

      .share-button {
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;

        &:focus-visible {
          outline: var(--space-tiny) solid var(--focus-ring-color);
          outline-offset: var(--focus-ring-offset);
        }

        &:hover {
          scale: 1.08;
        }

        &:active {
          scale: 0.95;
        }

        img {
          width: var(--button-icon-size);
          height: var(--button-icon-size);
        }
      }

      .share-preview {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        transition: opacity var(--content-fade-time) var(--menu-spring);
        transition-delay: var(--preview-return-delay);

        img {
          width: var(--button-icon-size);
          height: var(--button-icon-size);
        }
      }

      .menu-content {
        visibility: hidden;
        padding: var(--space-small);
        opacity: 0;
        translate: 0 var(--content-entry-offset);
        transition:
          opacity var(--content-fade-time) var(--menu-spring),
          translate var(--content-fade-time) var(--menu-spring),
          visibility 0s var(--content-fade-time);

        hr {
          height: var(--space-tiny);
          margin: var(--space-small) 0;
          border: 0;
          border-radius: var(--space-tiny);
          background: var(--separator-color);
        }
      }

      .menu-item {
        display: grid;
        grid-template-columns: var(--icon-column-width) 1fr;
        gap: var(--space-medium);
        align-items: center;
        justify-items: start;
        width: 100%;
        padding: var(--space-medium);
        border: 0;
        border-radius: var(--item-radius);
        background: transparent;
        color: inherit;
        font-size: var(--item-text-size);
        text-align: left;
        cursor: pointer;

        &:active {
          translate: 0 var(--space-tiny);
        }

        img {
          width: var(--menu-icon-size);
          height: var(--menu-icon-size);
        }

        &:is(:hover, :focus-visible) {
          background: var(--item-highlight-color);
        }
      }

      .menu-panel {
        position: relative;
        width: var(--button-size);
        height: var(--button-size);
        interpolate-size: allow-keywords;
        overflow: hidden;
        border: 1px solid var(--menu-border-color);
        border-radius: calc(var(--button-size) / 2);
        background: var(--menu-background);
        box-shadow: var(--menu-shadow);
        transition:
          width var(--menu-resize-time) var(--menu-spring),
          height var(--menu-resize-time) var(--menu-spring),
          border-radius var(--menu-resize-time) var(--menu-spring);

        .share-button {
          width: 100%;
          height: 100%;
          transition: opacity var(--content-fade-time) var(--menu-spring);
        }

        &:has(.share-button[aria-expanded="true"]) {
          width: min(var(--menu-width), calc(100vw - 2 * var(--space-medium)));
          height: auto;
          border-radius: var(--menu-radius);

          .share-button {
            position: absolute;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transition: none;
          }

          .share-preview {
            opacity: 0;
            scale: 0.96;
            transition-delay: 0s;
          }

          .menu-content {
            visibility: visible;
            opacity: 1;
            translate: 0 0;
            transition-delay:
              var(--content-reveal-delay), var(--content-reveal-delay), 0s;
          }
        }
      }
    </style>
  </head>

  <body>
    <div class="share-menu">
      <div class="menu-panel">
        <button class="share-button" aria-label="Share" aria-expanded="false">
          <img
            src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/share.svg"
            alt=""
          />
        </button>

        <div class="share-preview">
          <img
            src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/share.svg"
            alt=""
          />
        </div>

        <div class="menu-content">
          <button class="menu-item">
            <img
              src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/twitter-x.svg"
              alt=""
            />
            <span>X</span>
          </button>

          <button class="menu-item">
            <img
              src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/facebook.svg"
              alt=""
            />
            <span>Facebook</span>
          </button>

          <button class="menu-item">
            <img
              src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/instagram.svg"
              alt=""
            />
            <span>Instagram</span>
          </button>

          <button class="menu-item">
            <img
              src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/bluesky.svg"
              alt=""
            />
            <span>Bluesky</span>
          </button>

          <button class="menu-item">
            <img
              src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/threads.svg"
              alt=""
            />
            <span>Threads</span>
          </button>

          <button class="menu-item">
            <img
              src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/line.svg"
              alt=""
            />
            <span>LINE</span>
          </button>

          <hr />

          <button class="menu-item">
            <img
              src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/link-45deg.svg"
              alt=""
            />
            <span>Copy link</span>
          </button>
        </div>
      </div>
    </div>

    <script>
      const shareMenu = document.querySelector(".share-menu");
      const shareButton = document.querySelector(".share-button");

      // 開閉状態は読み上げにも使うaria-expandedだけで管理する。
      document.addEventListener("click", ({ target }) => {
        if (shareButton.contains(target)) {
          const isOpen = shareButton.ariaExpanded === "true";
          shareButton.ariaExpanded = String(!isOpen);
        } else if (
          !shareMenu.contains(target) ||
          target.closest(".menu-item")
        ) {
          shareButton.ariaExpanded = "false";
        }
      });
    </script>
  </body>
</html>
