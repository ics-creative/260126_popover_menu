<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Plane Menu</title>

  <style>
    :root{
      --bg:#f2f4f7;
      --fg:#0f172a;
      --muted:#64748b;

      --surface:#fff;
      --border:#e2e8f0;

      --accent:#4f46e5;
      --hover:color-mix(in oklab,#000 8%,transparent);

      --btn-size:48px;
      --menu-width:196px;

      --radius-closed:24px;
      --radius-open:26px;

      --shadow:0 2px 10px rgb(15 23 42/.06);

      --dur-panel:600ms;
      --dur-content:200ms;

      --spring:linear(0,0.008,0.0299,0.0628,0.1044,0.1522,0.2046,0.2599,0.3166,0.3737,0.4302,0.4853,0.5385,0.5892,0.6371,0.682,0.7238,0.7623,0.7975,0.8295,0.8584,0.8843,0.9073,0.9276,0.9453,0.9607,0.974,0.9852,0.9947,1.0025,1.0089,1.014,1.018,1.0209,1.023,1.0244,1.0252,1.0254,1.0252,1.0246,1.0238,1.0227,1.0215,1.0202,1.0188,1.0173,1.0159,1.0144,1.013,1.0117,1.0104,1.0092,1.0081,1.007,1.006,1.0051,1.0043,1.0036,1.0029,1.0023,1.0018,1.0014,1.001,1.0007,1.0004,1.0001,0.9999,0.9998,0.9996,0.9995,0.9995,0.9994,0.9994,0.9994,0.9994,0.9994,0.9994,0.9994,0.9995,0.9995,0.9995,0.9996,0.9996,0.9996,0.9997,0.9997,0.9997,0.9998,0.9998,0.9998,0.9998,0.9999,0.9999,0.9999,0.9999,0.9999,1,1,1,1);

      --ease-out-quart:cubic-bezier(0.25,1,0.5,1);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:sans-serif;
    }

    .ui{
      position:absolute;
      top: calc(75% - 24px);
      left: calc(50% - 24px);
    }

    .menu-container{
      width:var(--btn-size);
      height:var(--btn-size);
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--surface);
      box-shadow:var(--shadow);
      overflow:hidden;
      transition:
        width var(--dur-panel) var(--spring),
        height var(--dur-panel) var(--spring),
        border-radius var(--dur-panel) var(--spring);
    }

    .menu-container.is-open{
      width:min(var(--menu-width),calc(100vw - 24px));
      height:auto;
      border-radius:var(--radius-open);
    }

    .btn{
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      border:0;
      background:transparent;
      padding:0;
      transition:opacity var(--dur-content) var(--spring);
    }

    .btn:focus-visible{
      outline:2px solid color-mix(in oklab,var(--accent) 35%,transparent);
      outline-offset:3px;
    }

    .btn:hover{
      scale:1.08;
    }

    .btn:active{
      scale:.95;
    }

    .btn img{
      width:20px;
      height:20px;
    }

    .menu-container.is-open .btn{
      opacity:0;
      pointer-events:none;
      position:absolute;
      transition:opacity 0s linear 0s;
    }

    .cap{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      pointer-events:none;
      transition:opacity var(--dur-content) var(--spring);
      transition-delay:60ms;
    }

    .cap img{
      width:20px;
      height:20px;
    }

    .menu-container.is-open .cap{
      opacity:0;
      scale:.96;
      transition-delay:0ms;
    }

    .menu{
      position:relative;
      padding:8px;
      opacity:0;
      translate:0 -6px;
      pointer-events:none;
      transition:
        opacity var(--dur-content) var(--spring),
        translate var(--dur-content) var(--spring);
    }

    .menu-container.is-open .menu{
      opacity:1;
      translate:0 0;
      pointer-events:auto;
      transition-delay:70ms;
    }

    .hover-bg{
      position:absolute;
      left:0;
      top:0;
      width:100%;
      height:48px;
      border-radius:24px;
      background:var(--hover);
      opacity:0;
      transition:top 0s 1s,opacity .1s var(--ease-out-quart);
      pointer-events:none;
    }

    .it{
      position:relative;
      width:100%;
      border:0;
      background:transparent;
      appearance:none;

      display:grid;
      grid-template-columns:18px 1fr;
      gap:12px;
      align-items:center;
      justify-items:start;

      padding:12px;
      border-radius:16px;
      font-size:1rem;
      color:var(--fg);
      cursor:pointer;
      user-select:none;
      text-align:left;

      &:is(:hover,:focus-visible) ~ .hover-bg,
      &:first-child:is(:hover,:focus-visible) ~ * .hover-bg{
        top:0;
        opacity:1;
        transition:
          top .3s var(--ease-out-quart),
          opacity .3s .15s var(--ease-out-quart);
      }

      &:active{
        translate:0 2px;
      }

      & img{
        width:16px;
        height:16px;
      }
    }

    .menu-item-wrapper{
      position:relative;
    }

    .menu-item-wrapper:has(.it:hover) .hover-bg,
    .menu-item-wrapper:has(.it:focus-visible) .hover-bg{
      opacity:1;
      transition:
        top .3s var(--ease-out-quart),
        opacity .3s .15s var(--ease-out-quart);
    }

    .menu-item-wrapper:first-child .hover-bg{
      top:0;
    }

    .menu-item-wrapper:nth-child(2) .hover-bg{
      top:48px;
    }

    .menu-item-wrapper:nth-child(3) .hover-bg{
      top:96px;
    }

    .menu-item-wrapper:nth-child(4) .hover-bg{
      top:144px;
    }

    .menu-item-wrapper:nth-child(5) .hover-bg{
      top:192px;
    }

    .menu-item-wrapper:nth-child(6) .hover-bg{
      top:240px;
    }

    .menu-item-wrapper:nth-child(7) .hover-bg{
      top:288px;
    }

    .menu-item-wrapper:nth-child(8) .hover-bg{
      top:336px;
    }

    .menu hr{
      height:2px;
      border:0;
      margin:8px 0;
      background:color-mix(in oklab,var(--border) 75%,#fff);
      border-radius:999px;
    }
  </style>
</head>

<body>
<div class="ui">
  <div class="menu-container" id="menuContainer">
    <button class="btn" id="btn" aria-label="Share">
      <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/share.svg" alt="" >
    </button>

    <div class="cap">
      <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/share.svg" alt="" >
    </div>

    <div class="menu">
      <div class="menu-item-wrapper">
        <span class="hover-bg"></span>
        <button class="it" role="menuitem" data-close>
          <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/twitter-x.svg" alt="" >
          <span>X</span>
        </button>
      </div>

      <div class="menu-item-wrapper">
        <span class="hover-bg"></span>
        <button class="it" role="menuitem" data-close>
          <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/facebook.svg" alt="" >
          <span>Facebook</span>
        </button>
      </div>

      <div class="menu-item-wrapper">
        <span class="hover-bg"></span>
        <button class="it" role="menuitem" data-close>
          <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/instagram.svg" alt="" >
          <span>Instagram</span>
        </button>
      </div>

      <div class="menu-item-wrapper">
        <span class="hover-bg"></span>
        <button class="it" role="menuitem" data-close>
          <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/bluesky.svg" alt="" >
          <span>Bluesky</span>
        </button>
      </div>

      <div class="menu-item-wrapper">
        <span class="hover-bg"></span>
        <button class="it" role="menuitem" data-close>
          <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/threads.svg" alt="" >
          <span>Threads</span>
        </button>
      </div>

      <div class="menu-item-wrapper">
        <span class="hover-bg"></span>
        <button class="it" role="menuitem" data-close>
          <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/line.svg" alt="" >
          <span>LINE</span>
        </button>
      </div>

      <hr />

      <div class="menu-item-wrapper">
        <span class="hover-bg"></span>
        <button class="it" role="menuitem" data-close>
          <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/icons/link-45deg.svg" alt="" >
          <span>Copy link</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const menuContainer = document.querySelector("#menuContainer");
  const btn = document.querySelector("#btn");
  const menuItems = document.querySelectorAll("[data-close]");

  btn?.addEventListener("click", () => {
    menuContainer?.classList.toggle("is-open");
  });

  menuItems.forEach(item => {
    item.addEventListener("click", () => {
      menuContainer?.classList.remove("is-open");
    });
  });

  // メニュー外をクリックしたら閉じる
  document.addEventListener("click", (e) => {
    if (menuContainer?.classList.contains("is-open") && !menuContainer.contains(e.target)) {
      menuContainer.classList.remove("is-open");
    }
  });
</script>

</body>
</html>
